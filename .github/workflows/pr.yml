# SPDX-License-Identifier: MIT
name: pr

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  # The merge queue runs the same checks on the merged result before it lands on main. A merge
  # group has no pull request number and no pull request, so the jobs that read the pull
  # request (title, dependency review) run on pull requests only, and the others take their
  # commit range from the merge group.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ts: ${{ steps.filter.outputs.ts }}
      stack: ${{ steps.filter.outputs.stack }}
      shell: ${{ steps.filter.outputs.shell }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
      contract: ${{ steps.filter.outputs.contract }}
      image: ${{ steps.filter.outputs.image }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On a pull request this lists the files through the API. In the merge queue it compares
      # the merge group's base commit with its head commit (built into this action), so the
      # queue runs the same narrow set of jobs as the pull request did.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.github/workflows/pr.yml'
            ts:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.json'
              - '**/*.css'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.github/workflows/pr.yml'
            stack:
              - 'compose*.yaml'
              - 'VERSION'
              - 'scripts/check-version.sh'
              - 'image/edge/**'
              - 'e2e/**'
              - '.github/workflows/images.yml'
              - '.github/workflows/pr.yml'
            shell:
              - '**/*.sh'
              - 'scripts/**'
              - '.github/workflows/pr.yml'
            docs:
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'
              - '_typos.toml'
              - '.github/workflows/pr.yml'
            contract:
              - 'contract/**'
              - 'internal/contract/**'
              - 'packages/contract-ts/**'
              - 'scripts/gen.sh'
              - 'go.mod'
              - 'go.sum'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/pr.yml'
            ui:
              - 'ui/**'
              - 'packages/contract-ts/**'
              - 'plugins/agents-one-theme/theme.json'
              - 'brand/type/**'
              - 'contract/fixtures/api/**'
              - 'cmd/agentsoned-fake/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/pr.yml'
            workflows:
              - '.github/workflows/**'
              - '.github/dependabot.yml'
            image:
              - 'image/**'
              - '.github/workflows/pr.yml'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Go files
        id: detect
        run: |
          if [ -n "$(find . -name '*.go' -not -path './node_modules/*' -print -quit)" ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "No Go files yet, skipping Go checks."
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.detect.outputs.has_go == 'true'
        with:
          go-version-file: go.mod
      - name: go mod tidy
        if: steps.detect.outputs.has_go == 'true'
        # Fails when go.mod or go.sum differ from what `go mod tidy` writes; run it and commit.
        run: go mod tidy -diff
      - name: gofmt
        if: steps.detect.outputs.has_go == 'true'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        if: steps.detect.outputs.has_go == 'true'
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: steps.detect.outputs.has_go == 'true'
        with:
          version: latest
      - name: go test
        if: steps.detect.outputs.has_go == 'true'
        run: |
          go test -race -count=50 -v -run 'TestProxy_AnswersAProblemWhenTheMachineIsDown' ./internal/edge/door/adapters/proxy | grep -c '^--- PASS'
          go test -race -count=50 ./internal/edge/door/adapters/proxy

  go-integration:
    # Linux system tests (TESTING.md B6): real users, homes, sockets and
    # cgroup v2 limits, run as root inside an unprivileged container (no
    # --privileged, no cap_add), the way the machine container runs.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: system tests in an unprivileged container
        run: |
          docker version --format 'docker client {{.Client.Version}} server {{.Server.Version}}'
          uname -r
          mkdir -p systest
          pkgs="$(grep -rlE --include='*_test.go' '^//go:build .*integration' . | xargs -r -n1 dirname | sort -u)"
          if [ -z "$pkgs" ]; then
            echo "No system tests yet."
            exit 0
          fi
          for p in $pkgs; do
            CGO_ENABLED=0 go test -c -tags integration -o "systest/$(echo "${p#./}" | tr / _).test" "$p"
          done
          for bin in systest/*.test; do
            echo "== $bin"
            docker run --rm --cgroupns=private \
              --security-opt writable-cgroups=true --security-opt no-new-privileges=true \
              -e AGENTSONE_SYSTEST_IN_CONTAINER=1 -v "$PWD/systest:/systest:ro" \
              ubuntu:24.04 sh -c 'grep CapEff /proc/self/status; exec "/systest/$(basename "$0")" -test.v -test.count=1' "$bin"
          done

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: redocly lint
        run: pnpm exec redocly lint --config contract/redocly.yaml
      - name: generated code is up to date
        run: make check-gen
      - name: contract tests
        run: go test -race ./internal/contract/... ./internal/auditchain/... ./cmd/agentsoned-fake/...

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  # Narrow checks for the compose stack; image builds and the compose end-to-end run are on main
  # only (images.yml).
  stack:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compose config
        run: docker compose config -q
      - name: Default image tag is v<VERSION>
        run: scripts/check-version.sh
      - name: Coolify file matches compose.yaml with the overlay
        env:
          AGENTSONE_DOMAIN: door.example.test
          AGENTSONE_CONTROL_DOMAIN: control.example.test
        run: |
          docker compose -f compose.coolify.yaml config -q
          if ! diff -u \
            <(docker compose -f compose.yaml -f compose.coolify-overlay.yaml config --format json) \
            <(docker compose -f compose.coolify.yaml config --format json); then
            echo "compose.coolify.yaml is out of date; remake it as its header says" >&2
            exit 1
          fi
      - name: hadolint
        run: docker run --rm -v "$PWD/image/edge:/work:ro" --workdir /work "$HADOLINT_IMAGE" hadolint Dockerfile
      - name: e2e stage list
        run: e2e/run.sh list

  ui:
    # Every interface page, in every state, light and dark, phone and desktop, against the fake
    # daemon (TESTING.md B7c). Screenshots are kept for human review (B7d).
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./ui build
      - run: pnpm --filter ./ui exec playwright install --with-deps chromium
      - run: pnpm --filter ./ui e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-screenshots
          path: |
            ui/screenshots/
            ui/test-results/
          retention-days: 14
          if-no-files-found: ignore

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          {
            git ls-files -z '*.sh'
            printf '%s\0' scripts/heavy
          } | xargs -0 shellcheck
      - name: coverage gate self-test
        run: scripts/test-check-coverage.sh
      - name: version check self-test
        run: scripts/test-check-version.sh

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
      GO_IMAGE: golang:1.27.4-trixie@sha256:f18c3d73a184fb0582828510722e723b63a93f7188d11dd223d9be6f6880e65d
      MACHINE_IMAGE: agentsone-machine:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        run: docker run --rm -v "$PWD/image/machine:/work:ro" --workdir /work "$HADOLINT_IMAGE" hadolint Dockerfile
      - name: build script tests
        run: docker run --rm -v "$PWD/image/machine:/src:ro" "$GO_IMAGE" /src/test/build-go.test.sh
      - name: build the machine image (linux/amd64, not pushed)
        run: docker buildx build -f image/machine/Dockerfile --platform linux/amd64 --load -t "$MACHINE_IMAGE" .
      - name: image size
        run: |
          bytes="$(docker image inspect --format '{{.Size}}' "$MACHINE_IMAGE")"
          echo "machine image (linux/amd64): $((bytes / 1000000)) MB"
      - name: entrypoint, fetch and health check tests in the image
        run: |
          for t in entrypoint fetch-pinned healthcheck; do
            docker run --rm -v "$PWD/image/machine:/src:ro" --entrypoint "/src/test/$t.test.sh" "$MACHINE_IMAGE"
          done
      - name: smoke test (healthy, clean log, clean stop, key kept)
        run: image/ci/smoke.sh "$MACHINE_IMAGE"

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --exclude-loopback --accept '100..=103,200..=299,429' './**/*.md'
          fail: true

  # Spelling runs on every pull request: code strings and comments slip in
  # through Go and TypeScript changes, not only through docs.
  spelling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  spdx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-spdx.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - name: Scan the pull request or merge group range
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" .'

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          comment-summary-in-pr: never

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  gate:
    if: always()
    needs:
      - changes
      - go
      - go-integration
      - contract
      - ts
      - stack
      - ui
      - shell
      - workflows
      - image
      - docs
      - spelling
      - spdx
      - secrets
      - dependency-review
      - pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure | cancelled)
                echo "A required job did $r." >&2
                exit 1
                ;;
            esac
          done
