# SPDX-License-Identifier: MIT
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - misspell
    - errorlint
    - nilerr
    - bodyclose
    - nolintlint
    - forbidigo
    - depguard
  settings:
    errcheck:
      # A dropped error hides a dead feature: `_ = f()` counts as a drop too.
      # A blank needs `//nolint:errcheck // <why ignoring is correct>`.
      check-blank: true
      check-type-assertions: true
    forbidigo:
      forbid:
        - pattern: ^time\.Sleep$
          msg: tests wait on a fake clock, a channel or a deadline loop, never a sleep (TESTING.md)
      analyze-types: true
    depguard:
      rules:
        no-mocking-frameworks:
          deny:
            - pkg: github.com/stretchr/testify
              desc: use the standard testing package and hand-written fakes (TESTING.md)
            - pkg: github.com/golang/mock
              desc: write a fake in <package>test or internal/core/coretest instead
            - pkg: go.uber.org/mock
              desc: write a fake in <package>test or internal/core/coretest instead
            - pkg: github.com/vektra/mockery
              desc: write a fake in <package>test or internal/core/coretest instead
        harness-only-in-tests:
          # The harness runs the daemon on fakes and points the gateway at any
          # provider; no shipped binary may hold it (TESTING.md B5f).
          files:
            - "!$test"
          deny:
            - pkg: github.com/SDK-E/agentsone/internal/daemontest
              desc: the real-daemon harness is for _test.go files only (TESTING.md B5f)
  exclusions:
    rules:
      - path-except: _test\.go$
        linters:
          - forbidigo
      # Test code (_test.go files and the <package>test helper packages) may
      # drop errors with a blank or an unchecked type assertion: a dropped
      # error there fails the test's own assertions instead of hiding a dead
      # feature. Plain unchecked calls are still errcheck errors in tests.
      # The source pattern matches `_ =`, `x, _ :=` and `.(T)` lines.
      - path: (_test\.go$|/[a-z]+test/)
        linters:
          - errcheck
        source: (^|[^\w])_\s*(,\s*[\w.\[\]"]+\s*)*:?=([^=]|$)|,\s*_\s*:?=([^=]|$)|\.\(\*?[\w.\[\]]+\)
      # Transition: production areas whose blank drops are not fixed yet.
      # Each stacked fix PR deletes its own rule; then this block is gone.
      # Same source pattern as above, so plain unchecked calls stay errors.
      - path: ^internal/(agents|machine)/
        linters:
          - errcheck
        source: (^|[^\w])_\s*(,\s*[\w.\[\]"]+\s*)*:?=([^=]|$)|,\s*_\s*:?=([^=]|$)|\.\(\*?[\w.\[\]]+\)
      - path: ^(runners/|internal/auth/app/service\.go$)
        linters:
          - errcheck
        source: (^|[^\w])_\s*(,\s*[\w.\[\]"]+\s*)*:?=([^=]|$)|,\s*_\s*:?=([^=]|$)|\.\(\*?[\w.\[\]]+\)

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/SDK-E/agentsone
