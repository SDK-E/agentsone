# SPDX-License-Identifier: MIT
#
# The file to deploy on Coolify, with Raw Compose Deployment turned on (docs/deploy/coolify.md).
# It is compose.yaml with compose.coolify-overlay.yaml applied, so read those two for what each
# setting does and which wall it keeps. Do not edit this file by hand; remake it with
#
#   docker compose -f compose.yaml -f compose.coolify-overlay.yaml config --no-interpolate
#
# and put this header back on top. CI fails when this file and the two sources drift apart.
name: agentsone
networks:
  inner:
    enable_ipv6: false
    internal: true
    ipam:
      config:
        - ip_range: ${AGENTSONE_INNER_DYNAMIC_RANGE:-10.77.42.16/28}
          subnet: ${AGENTSONE_INNER_SUBNET:-10.77.42.0/27}
    name: agentsone_inner
  proxy:
    external: true
    name: ${AGENTSONE_PROXY_NETWORK:-coolify}
services:
  control:
    cap_drop:
      - ALL
    command:
      - control
    depends_on:
      edge:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 256
    healthcheck:
      interval: 30s
      retries: 3
      start_interval: 2s
      start_period: 30s
      test:
        - CMD
        - /usr/local/bin/probe
        - tcp
        - 127.0.0.1:8081
      timeout: 5s
    image: ghcr.io/sdk-e/agentsone-edge:${AGENTSONE_IMAGE_TAG:-sha-2ae167fa0cad45477a3cddc49d68e0bbcd8eeb8f}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${AGENTSONE_PROXY_NETWORK:-coolify}
      - traefik.http.middlewares.agentsone-https.redirectscheme.scheme=https
      - traefik.http.routers.agentsone-control-http.rule=Host(`${AGENTSONE_CONTROL_DOMAIN:?set
        AGENTSONE_CONTROL_DOMAIN to the control page domain}`)
      - traefik.http.routers.agentsone-control-http.entrypoints=http
      - traefik.http.routers.agentsone-control-http.middlewares=agentsone-https
      - traefik.http.routers.agentsone-control.rule=Host(`${AGENTSONE_CONTROL_DOMAIN:?set
        AGENTSONE_CONTROL_DOMAIN to the control page domain}`)
      - traefik.http.routers.agentsone-control.entrypoints=https
      - traefik.http.routers.agentsone-control.tls=true
      - traefik.http.routers.agentsone-control.tls.certresolver=letsencrypt
      - traefik.http.routers.agentsone-control.service=agentsone-control
      - traefik.http.routers.agentsone-control.middlewares=${AGENTSONE_CONTROL_MIDDLEWARES:-}
      - traefik.http.services.agentsone-control.loadbalancer.server.port=8081
    memswap_limit: 256m
    networks:
      proxy: {}
    ports:
      - ${AGENTSONE_BIND_ADDR:-127.0.0.1}:${AGENTSONE_CONTROL_PORT:-7781}:8081
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    user: 65533:65532
    volumes:
      - source: edge-admin
        target: /run/agentsone-edge-admin
        type: volume
        volume: {}
  edge:
    cap_drop:
      - ALL
    command:
      - edge
      - --inner-addr=${AGENTSONE_EDGE_IP:-10.77.42.2}
      - --door-addr=${AGENTSONE_PROXY_ALIAS:-agentsone-door}:8080
      - --egress-deny=${AGENTSONE_EGRESS_DENY:-}
    deploy:
      resources:
        limits:
          cpus: ${AGENTSONE_EDGE_CPUS:-2}
          memory: ${AGENTSONE_EDGE_MEMORY:-1g}
          pids: 1024
    healthcheck:
      interval: 30s
      retries: 3
      start_interval: 2s
      start_period: 30s
      test:
        - CMD
        - /usr/local/bin/probe
        - tcp
        - ${AGENTSONE_EDGE_IP:-10.77.42.2}:53
      timeout: 5s
    image: ghcr.io/sdk-e/agentsone-edge:${AGENTSONE_IMAGE_TAG:-sha-2ae167fa0cad45477a3cddc49d68e0bbcd8eeb8f}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${AGENTSONE_PROXY_NETWORK:-coolify}
      - traefik.http.middlewares.agentsone-https.redirectscheme.scheme=https
      - traefik.http.routers.agentsone-door-http.rule=Host(`${AGENTSONE_DOMAIN:?set
        AGENTSONE_DOMAIN to the web door domain}`)
      - traefik.http.routers.agentsone-door-http.entrypoints=http
      - traefik.http.routers.agentsone-door-http.middlewares=agentsone-https
      - traefik.http.routers.agentsone-door.rule=Host(`${AGENTSONE_DOMAIN:?set AGENTSONE_DOMAIN
        to the web door domain}`)
      - traefik.http.routers.agentsone-door.entrypoints=https
      - traefik.http.routers.agentsone-door.tls=true
      - traefik.http.routers.agentsone-door.tls.certresolver=letsencrypt
      - traefik.http.routers.agentsone-door.service=agentsone-door
      - traefik.http.routers.agentsone-door.middlewares=${AGENTSONE_DOOR_MIDDLEWARES:-}
      - traefik.http.services.agentsone-door.loadbalancer.server.port=8080
    memswap_limit: ${AGENTSONE_EDGE_MEMORY:-1g}
    networks:
      inner:
        ipv4_address: ${AGENTSONE_EDGE_IP:-10.77.42.2}
      proxy:
        aliases:
          - ${AGENTSONE_PROXY_ALIAS:-agentsone-door}
    ports:
      - ${AGENTSONE_BIND_ADDR:-127.0.0.1}:${AGENTSONE_WEB_DOOR_PORT:-7780}:8080
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    user: 65532:65532
    volumes:
      - source: edge-data
        target: /var/lib/agentsone-edge
        type: volume
        volume: {}
      - source: gateway-key
        target: /var/lib/agentsone-edge/gateway-key
        type: volume
        volume: {}
      - source: edge-admin
        target: /run/agentsone-edge-admin
        type: volume
        volume: {}
  machine:
    cgroup: private
    depends_on:
      edge:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: ${AGENTSONE_MACHINE_CPUS:-4}
          memory: ${AGENTSONE_MACHINE_MEMORY:-8g}
          pids: ${AGENTSONE_MACHINE_PIDS:-4096}
    dns:
      - ${AGENTSONE_EDGE_IP:-10.77.42.2}
    environment:
      AGENTSONE_EDGE_IP: ${AGENTSONE_EDGE_IP:-10.77.42.2}
    image: ghcr.io/sdk-e/agentsone-machine:${AGENTSONE_IMAGE_TAG:-sha-2ae167fa0cad45477a3cddc49d68e0bbcd8eeb8f}
    memswap_limit: ${AGENTSONE_MACHINE_MEMORY:-8g}
    networks:
      inner: null
    restart: unless-stopped
    security_opt:
      - writable-cgroups=true
      - no-new-privileges=true
    stop_grace_period: 30s
    volumes:
      - source: machine-state
        target: /var/lib/agentsone
        type: volume
        volume: {}
      - source: machine-plugins
        target: /var/lib/agentsone/plugins
        type: volume
        volume: {}
      - source: machine-audit
        target: /var/lib/agentsone/audit
        type: volume
        volume: {}
      - source: machine-home
        target: /home
        type: volume
        volume: {}
      - source: machine-engines
        target: /var/lib/agentsone-engines
        type: volume
        volume: {}
      - read_only: true
        source: gateway-key
        target: /run/agentsone/gateway-key
        type: volume
        volume: {}
volumes:
  edge-admin:
    name: agentsone_edge-admin
  edge-data:
    name: agentsone_edge-data
  gateway-key:
    name: agentsone_gateway-key
  machine-audit:
    name: agentsone_machine-audit
  machine-engines:
    name: agentsone_machine-engines
  machine-home:
    name: agentsone_machine-home
  machine-plugins:
    name: agentsone_machine-plugins
  machine-state:
    name: agentsone_machine-state
