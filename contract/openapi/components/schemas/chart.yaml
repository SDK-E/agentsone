# SPDX-License-Identifier: MIT
# Org chart, charter and goals.

ChartNode:
  type: object
  required: [agent, display_name, kind, is_root, state, role, children]
  properties:
    agent:
      $ref: "./common.yaml#/AgentName"
    display_name:
      $ref: "./common.yaml#/DisplayName"
    kind:
      $ref: "./agents.yaml#/AgentKind"
    is_root:
      type: boolean
    state:
      $ref: "./agents.yaml#/AgentState"
    role:
      type: string
    children:
      type: array
      items:
        $ref: "#/ChartNode"

Chart:
  type: object
  description: The org chart. Agents only; humans are not in the chart.
  required: [roots, agent_count, updated_at]
  properties:
    roots:
      type: array
      items:
        $ref: "#/ChartNode"
    agent_count:
      type: integer
      minimum: 0
    updated_at:
      $ref: "./common.yaml#/Timestamp"

ChartMove:
  type: object
  additionalProperties: false
  description: Move an agent (and its branch) under a new manager. Both must be below the caller.
  required: [agent, new_manager]
  properties:
    agent:
      $ref: "./common.yaml#/AgentName"
    new_manager:
      $ref: "./common.yaml#/AgentName"

Charter:
  type: object
  description: The society's optional charter. Agents may rewrite it; every change is audited.
  required: [text, version, updated_at, updated_by]
  properties:
    text:
      type: string
      maxLength: 64000
      description: Markdown.
    version:
      type: integer
      minimum: 0
      description: Increments on every change. 0 means no charter yet.
    updated_at:
      $ref: "./common.yaml#/Timestamp"
    updated_by:
      $ref: "./common.yaml#/Actor"

CharterUpdate:
  type: object
  additionalProperties: false
  required: [text, expected_version]
  properties:
    text:
      type: string
      maxLength: 64000
    expected_version:
      type: integer
      minimum: 0
      description: Version the writer read. A mismatch returns 409.

GoalStatus:
  type: string
  enum: [open, achieved, dropped]

Goal:
  type: object
  required: [id, owner, title, detail, status, parent_id, created_at, updated_at]
  properties:
    id:
      $ref: "./common.yaml#/GoalId"
    owner:
      $ref: "./common.yaml#/AgentName"
    title:
      type: string
      minLength: 1
      maxLength: 200
    detail:
      type: string
      maxLength: 8000
    status:
      $ref: "#/GoalStatus"
    parent_id:
      type: [string, "null"]
      pattern: "^gol_[0-9A-HJKMNP-TV-Z]{26}$"
      description: Goal of the manager this goal serves, or null.
    created_at:
      $ref: "./common.yaml#/Timestamp"
    updated_at:
      $ref: "./common.yaml#/Timestamp"

GoalList:
  type: object
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: "#/Goal"
    next_cursor:
      $ref: "./common.yaml#/Cursor"

GoalCreate:
  type: object
  additionalProperties: false
  required: [title]
  properties:
    owner:
      $ref: "./common.yaml#/AgentName"
      description: Defaults to the caller. Another owner must be below the caller.
    title:
      type: string
      minLength: 1
      maxLength: 200
    detail:
      type: string
      maxLength: 8000
    parent_id:
      $ref: "./common.yaml#/GoalId"

GoalUpdate:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
    detail:
      type: string
      maxLength: 8000
    status:
      $ref: "#/GoalStatus"
