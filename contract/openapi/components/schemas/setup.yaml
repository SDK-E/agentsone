# SPDX-License-Identifier: MIT
# First-boot setup: first human, Claude engine licence, engine fetch.

SetupPhase:
  type: string
  enum: [needs-human, needs-licence, fetching-engine, ready]
  description: |
    Where first boot stands. `needs-human` until the first human exists; `ready` after. The Claude
    engine is off by default and turned on later in Settings, so first setup does not wait for its
    licence or its download: `licence_accepted` and `engine` say where the engine stands.
    `needs-licence` and `fetching-engine` are kept for older clients; the daemon does not enter them.

SetupStatus:
  type: object
  required: [phase, first_human_created, licence_accepted, engine, seed_installed, contract_version]
  properties:
    phase:
      $ref: "#/SetupPhase"
    first_human_created:
      type: boolean
    licence_accepted:
      type: boolean
    engine:
      $ref: "#/EngineFetchStatus"
    seed_installed:
      type: boolean
      description: True once the default "Small Seed" plugin has created the founder, router and waker.
    contract_version:
      type: string
      description: Semantic version of this API contract that the daemon implements.
      examples: ["1.0.0"]

FirstHumanCreate:
  type: object
  additionalProperties: false
  required: [name, display_name, password]
  properties:
    name:
      $ref: "./common.yaml#/HumanName"
    display_name:
      $ref: "./common.yaml#/DisplayName"
    password:
      type: string
      format: password
      writeOnly: true
      minLength: 12
      maxLength: 256
      description: Set as the Linux password through PAM. Never stored or logged by the daemon.

EngineLicence:
  type: object
  required: [engine, version, text, accepted, accepted_at, accepted_by]
  properties:
    engine:
      type: string
      description: Engine the licence covers.
      examples: [claude-code]
    version:
      type: string
      description: Licence text version. Acceptance names this version.
    text:
      type: string
      description: Full licence text in Markdown, shown on screen before acceptance.
    accepted:
      type: boolean
    accepted_at:
      type: [string, "null"]
      format: date-time
    accepted_by:
      type: [string, "null"]
      pattern: "^[a-z][a-z0-9-]{0,30}$"
      description: Human who accepted, or null.

LicenceAccept:
  type: object
  additionalProperties: false
  required: [accept, version]
  properties:
    accept:
      type: boolean
      const: true
    version:
      type: string
      description: Licence version the human read; must match the current one.

EngineFetchState:
  type: string
  enum: [waiting-licence, queued, downloading, verifying, ready, failed]

EngineFetchStatus:
  type: object
  required: [state, progress, bytes_done, bytes_total, version, error, updated_at]
  properties:
    state:
      $ref: "#/EngineFetchState"
    progress:
      type: number
      minimum: 0
      maximum: 1
    bytes_done:
      type: integer
      format: int64
      minimum: 0
    bytes_total:
      type: [integer, "null"]
      format: int64
      minimum: 0
    version:
      type: [string, "null"]
      description: Engine version once known.
    error:
      type: [string, "null"]
      description: Last failure in plain words, or null.
    updated_at:
      $ref: "./common.yaml#/Timestamp"
