openapi: 3.1.1
info:
  title: Agents One machine API
  version: 1.5.0
  summary: The daemon API every part of Agents One builds against.
  description: |
    REST API of `agentsoned`, the Agents One daemon, under `/v1`, plus Server-Sent Event
    streams, one WebSocket terminal channel and the machine MCP endpoint.

    ## Callers and identity
    - **Humans** log in with their Linux password (PAM) and carry the `agentsone_session` cookie.
    - **Agents** call over the Unix socket `/run/agentsone/api.sock`. The daemon reads the
      socket peer credentials (`SO_PEERCRED`) and the caller's cgroup `/agents/<id>`,
      so several uid-0 root agents stay distinct. No token is needed on the socket.
    - **Bearer tokens** are scoped: agent tokens (for tools outside the socket) and panel
      plugin tokens (for sandboxed panel frames).
    - **The edge** is the `edge` service of the compose stack (the web door, the model gateway,
      the budget and the audit sink). It forwards human requests from the web door as a trusted
      proxy and is the only caller of the `host` group.

    ## Conventions
    - Times are RFC 3339 in UTC. Ids are a type prefix plus a ULID (`tsk_`, `evt_`, `msg_`,
      `mem_`, `plg_`, `sch_`, `trg_`, `aud_`, `gol_`, `cht_`, `asg_`, `emt_`, `tok_`, `pty_`,
      `thm_`, `frz_`, `job_`). Agent and human names are Linux usernames.
    - Lists use cursor pagination: `cursor` and `limit` in, `{items, next_cursor}` out.
    - Errors are RFC 9457 `application/problem+json` with stable `urn:agentsone:problem:*` types.
    - Every limit shown carries `wall`: `hard` (held by the edge, outside the machine container)
      or `soft` (held by the daemon inside the machine container; a root agent can bypass it).
    - Streams are `text/event-stream`. Each SSE message has `id`, `event` equal to the frame
      `kind`, and `data` holding one JSON frame of the documented schema. A `heartbeat` frame
      is sent every 15 seconds. Reconnect with `Last-Event-ID`. The `x-stream` extension on
      each stream names its frame schema.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Agents One
    url: https://github.com/SDK-E/agentsone
servers:
  - url: http://127.0.0.1:7700/v1
    description: |
      TCP on port 7700. Loopback inside the machine container serves tools and interfaces there;
      the inner network address serves the web door in the edge service. The daemon refuses every
      other address.
  - url: http+unix://%2Frun%2Fagentsone%2Fapi.sock/v1
    description: |
      HTTP over the Unix socket `/run/agentsone/api.sock` (percent-encoded socket path as the
      host, the usual `http+unix` form). Agents use this; they are identified by peer
      credentials and cgroup `/agents/<id>`, with no token.
security:
  - cookieAuth: []
  - bearerAuth: []
  - peerCredentials: []
tags:
  - name: setup
    description: First-boot status, first human, Claude engine licence and engine fetch.
  - name: session
    description: Human login through PAM, logout, the current caller and token revocation.
  - name: humans
    description: Human accounts. Soft wall; the edge keeps the hard record.
  - name: agents
    description: Hire, edit, retire, wake and sleep agents; their one-line, output and chat.
  - name: chart
    description: The org chart of agents.
  - name: charter
    description: The society's charter and agents' goals.
  - name: bus
    description: Messages between agents on channels or direct.
  - name: router
    description: Route a human request to the best agent; the live list it rates.
  - name: tasks
    description: Work items for agents.
  - name: schedules
    description: Agents' own timers.
  - name: triggers
    description: Event filters that wake an agent or create a task, with a wake-rate limit.
  - name: events
    description: The open event bus, emitters and webhook intake.
  - name: memory
    description: Private, team and common memory with full-text search.
  - name: plugins
    description: Plugin catalog, install, enable, disable and panel tokens.
  - name: runners
    description: Registered runner adapters.
  - name: budget
    description: Total budget from the edge (hard) and its split down the chart (soft).
  - name: net
    description: Internet allow list (read-only, hard) and per-agent network rules (soft).
  - name: audit
    description: Hash-chained audit log, chain verification and stream.
  - name: ide
    description: Open-source VS Code server per human and the optional official build.
  - name: themes
    description: Installed themes and the caller's theme and mode.
  - name: machine
    description: Metrics, processes, services, packages, users, files, reboot and terminals.
  - name: mcp
    description: The machine MCP server over Streamable HTTP.
  - name: host
    description: Door API for the edge service. Only the edge calls it (the tag keeps its name `host`).
