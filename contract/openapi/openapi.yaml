components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: agentsone_session
      description: Human session cookie set by `createSession` after a PAM login. HttpOnly, SameSite=Strict.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: agentsone-token
      description: |
        Scoped token: an agent token from `issueAgentToken`, or a panel plugin token from
        `issuePanelToken`. Scopes are `<group>:<read|write|admin>`, where the group is the
        operation's tag.

        Every operation that takes a token names the one scope it needs in its own `security`
        (`bearerAuth: [<group>:<level>]`). A token passes when it holds that scope or a higher
        level of the same group: `admin` covers `write` and `read`, `write` covers `read`.
        Otherwise the daemon answers 403 `urn:agentsone:problem:forbidden` before the operation
        runs. An operation whose `security` does not list `bearerAuth` refuses every token with
        the same 403. Session cookies and socket peer credentials carry no scopes; the caller
        kind and org chart rules decide for them, as before.
    peerCredentials:
      type: mutualTLS
      description: |
        Transport identity on the Unix socket `/run/agentsone/api.sock`. No TLS and no token:
        the daemon reads `SO_PEERCRED` (pid, uid) and the caller's cgroup, which must be
        `/agents/<id>`. Code generators should send nothing for this scheme.
    hostDoor:
      type: mutualTLS
      description: |
        Transport identity of the edge service. Only connections from the edge's inner network
        address (the daemon's `[edge] trusted_proxies` setting) are accepted. No TLS and no
        token; the `host` group is reachable only this way. The scheme keeps its name `hostDoor`.
        Code generators should send nothing for this scheme.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Agentsone-Signature
      description: "`sha256=<hex HMAC-SHA256 of the raw body>` using the emitter's webhook secret."
  schemas:
    Event:
      $ref: ../schemas/event.schema.json
    PluginManifest:
      $ref: ../schemas/plugin-manifest.schema.json
    Theme:
      $ref: ../schemas/theme.schema.json
    MemoryRecord:
      $ref: ../schemas/memory-record.schema.json
    AuditRecord:
