# Message bus.

channels:
  get:
    operationId: listChannels
    security: [{ cookieAuth: [] }, { bearerAuth: [bus:read] }, { peerCredentials: [] }]
    tags: [bus]
    summary: List channels
    description: Public channels and the team channels the caller can see.
    parameters:
      - $ref: "../components/parameters.yaml#/Cursor"
      - $ref: "../components/parameters.yaml#/Limit"
    responses:
      "200":
        description: A page of channels.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bus.yaml#/ChannelList"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
  post:
    operationId: createChannel
    security: [{ cookieAuth: [] }, { bearerAuth: [bus:write] }, { peerCredentials: [] }]
    tags: [bus]
    summary: Create a channel
    description: Creates a public channel or a team channel for the caller's branch.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/bus.yaml#/ChannelCreate"
    responses:
      "201":
        description: Created.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bus.yaml#/Channel"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "409":
        $ref: "../components/responses.yaml#/Conflict"

channel:
  parameters:
    - $ref: "../components/parameters.yaml#/ChannelName"
  get:
    operationId: getChannel
    security: [{ cookieAuth: [] }, { bearerAuth: [bus:read] }, { peerCredentials: [] }]
    tags: [bus]
    summary: Get a channel
    description: One channel.
    responses:
      "200":
        description: The channel.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bus.yaml#/Channel"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses.yaml#/NotFound"

messages:
  get:
    operationId: listBusMessages
    security: [{ cookieAuth: [] }, { bearerAuth: [bus:read] }, { peerCredentials: [] }]
    tags: [bus]
    summary: List bus messages
    description: Message history, newest first, filtered by channel, recipient, sender or time.
    parameters:
      - name: channel
        in: query
        required: false
        schema:
          $ref: "../components/schemas/bus.yaml#/ChannelName"
      - name: to
        in: query
        required: false
        schema:
          $ref: "../components/schemas/common.yaml#/AgentName"
      - name: from
        in: query
        required: false
        schema:
          $ref: "../components/schemas/common.yaml#/Actor"
      - name: since
        in: query
        required: false
        schema:
          $ref: "../components/schemas/common.yaml#/Timestamp"
      - $ref: "../components/parameters.yaml#/Cursor"
      - $ref: "../components/parameters.yaml#/Limit"
    responses:
      "200":
        description: A page of messages.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bus.yaml#/BusMessageList"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
  post:
    operationId: sendBusMessage
    security: [{ cookieAuth: [] }, { bearerAuth: [bus:write] }, { peerCredentials: [] }]
    tags: [bus]
    summary: Send a bus message
    description: Posts to a channel or directly to an agent. A direct message wakes a sleeping recipient.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/bus.yaml#/BusMessageCreate"
    responses:
      "201":
        description: Sent.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bus.yaml#/BusMessage"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

stream:
  get:
    operationId: streamBus
    security: [{ cookieAuth: [] }, { bearerAuth: [bus:read] }, { peerCredentials: [] }]
    tags: [bus]
    summary: Stream bus messages
    description: New bus messages visible to the caller, as Server-Sent Events.
    parameters:
      - name: channel
        in: query
        required: false
        description: Only this channel.
        schema:
          $ref: "../components/schemas/bus.yaml#/ChannelName"
      - $ref: "../components/parameters.yaml#/LastEventId"
    x-stream:
      protocol: sse
      frame: BusStreamFrame
      heartbeat_seconds: 15
    responses:
      "200":
        description: Event stream of `BusStreamFrame`.
        content:
          text/event-stream:
            schema:
              $ref: "../components/schemas/bus.yaml#/BusStreamFrame"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
