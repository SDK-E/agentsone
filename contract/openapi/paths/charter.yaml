# SPDX-License-Identifier: MIT
# Charter and goals.

charter:
  get:
    operationId: getCharter
    security: [{ cookieAuth: [] }, { bearerAuth: [charter:read] }, { peerCredentials: [] }]
    tags: [charter]
    summary: Get the charter
    description: The society's charter. Version 0 with empty text means no charter yet.
    responses:
      "200":
        description: The charter.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/chart.yaml#/Charter"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
  put:
    operationId: updateCharter
    security: [{ cookieAuth: [] }, { bearerAuth: [charter:write] }, { peerCredentials: [] }]
    tags: [charter]
    summary: Rewrite the charter
    description: Agents may rewrite the charter. `expected_version` must match or the call returns 409. Audited.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/chart.yaml#/CharterUpdate"
    responses:
      "200":
        description: The new charter.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/chart.yaml#/Charter"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "409":
        $ref: "../components/responses.yaml#/Conflict"

goals:
  get:
    operationId: listGoals
    security: [{ cookieAuth: [] }, { bearerAuth: [charter:read] }, { peerCredentials: [] }]
    tags: [charter]
    summary: List goals
    description: Goals agents set for themselves and the agents below them.
    parameters:
      - name: owner
        in: query
        required: false
        schema:
          $ref: "../components/schemas/common.yaml#/AgentName"
      - name: status
        in: query
        required: false
        schema:
          $ref: "../components/schemas/chart.yaml#/GoalStatus"
      - $ref: "../components/parameters.yaml#/Cursor"
      - $ref: "../components/parameters.yaml#/Limit"
    responses:
      "200":
        description: A page of goals.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/chart.yaml#/GoalList"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
  post:
    operationId: createGoal
    security: [{ cookieAuth: [] }, { bearerAuth: [charter:write] }, { peerCredentials: [] }]
    tags: [charter]
    summary: Set a goal
    description: Sets a goal for the caller or for an agent below the caller.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/chart.yaml#/GoalCreate"
    responses:
      "201":
        description: Created.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/chart.yaml#/Goal"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"

goal:
  parameters:
    - $ref: "../components/parameters.yaml#/GoalId"
  get:
    operationId: getGoal
    security: [{ cookieAuth: [] }, { bearerAuth: [charter:read] }, { peerCredentials: [] }]
    tags: [charter]
    summary: Get a goal
    description: One goal.
    responses:
      "200":
        description: The goal.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/chart.yaml#/Goal"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
  patch:
    operationId: updateGoal
    security: [{ cookieAuth: [] }, { bearerAuth: [charter:write] }, { peerCredentials: [] }]
    tags: [charter]
    summary: Edit a goal
    description: The owner or an agent above the owner may edit a goal.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/chart.yaml#/GoalUpdate"
    responses:
      "200":
        description: Updated.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/chart.yaml#/Goal"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
  delete:
    operationId: deleteGoal
    security: [{ cookieAuth: [] }, { bearerAuth: [charter:write] }, { peerCredentials: [] }]
    tags: [charter]
    summary: Delete a goal
    description: The owner or an agent above the owner may delete a goal. Prefer status `dropped` to keep history.
    responses:
      "204":
        description: Deleted.
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
