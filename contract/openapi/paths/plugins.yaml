sources:
  get:
    operationId: listPluginSources
    tags: [plugins]
    summary: List plugin sources
    description: Lists the catalog sources (Claude Code marketplace, own format, Agent Skills, MCP registry).
    parameters:
      - $ref: "../components/parameters.yaml#/Cursor"
      - $ref: "../components/parameters.yaml#/Limit"
    responses:
      "200":
        description: A page of sources.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/plugins.yaml#/PluginSourceList"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
catalog:
  get:
    operationId: searchPluginCatalog
    tags: [plugins]
    summary: Search the plugin catalog
    description: Searches all enabled sources. Results from each source are normalised into one entry shape.
    parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      - name: source
        in: query
        required: false
        schema:
          $ref: "../components/schemas/plugins.yaml#/PluginSourceId"
      - name: kind
        in: query
        required: false
        schema:
          $ref: "../components/schemas/plugins.yaml#/PluginKind"
      - $ref: "../components/parameters.yaml#/Cursor"
      - $ref: "../components/parameters.yaml#/Limit"
    responses:
      "200":
        description: A page of catalog entries.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/plugins.yaml#/CatalogList"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "503":
        $ref: "../components/responses.yaml#/Unavailable"
plugins:
  get:
    operationId: listPlugins
    tags: [plugins]
    summary: List installed plugins
    description: Lists installed plugins of every kind.
    parameters:
      - name: kind
        in: query
        required: false
        schema:
          $ref: "../components/schemas/plugins.yaml#/PluginKind"
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
      - $ref: "../components/parameters.yaml#/Cursor"
      - $ref: "../components/parameters.yaml#/Limit"
    responses:
      "200":
        description: A page of plugins.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/plugins.yaml#/PluginList"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
  post:
    operationId: installPlugin
    tags: [plugins]
    summary: Install a plugin
    description: Installs a plugin from a catalog source. Agents and humans may install; every install is audited.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/plugins.yaml#/PluginInstall"
    responses:
      "201":
        description: The installed plugin.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/plugins.yaml#/Plugin"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "503":
        $ref: "../components/responses.yaml#/Unavailable"
plugin:
  parameters:
    - $ref: "../components/parameters.yaml#/PluginId"
  get:
    operationId: getPlugin
    tags: [plugins]
    summary: Get a plugin
    description: Returns one installed plugin with its manifest.
    responses:
      "200":
        description: The plugin.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/plugins.yaml#/Plugin"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
  delete:
    operationId: uninstallPlugin
    tags: [plugins]
    summary: Uninstall a plugin
    description: Removes a plugin and everything it registered (servers, skills, runners, panels, themes, emitters).
    responses:
      "204":
        description: Uninstalled.
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
enable:
  parameters:
    - $ref: "../components/parameters.yaml#/PluginId"
  post:
    operationId: enablePlugin
    tags: [plugins]
    summary: Enable a plugin
    description: Turns a plugin on.
    responses:
      "200":
        description: The plugin, now enabled.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/plugins.yaml#/Plugin"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
disable:
  parameters:
    - $ref: "../components/parameters.yaml#/PluginId"
  post:
    operationId: disablePlugin
    tags: [plugins]
    summary: Disable a plugin
    description: Turns a plugin off without removing it.
    responses:
      "200":
        description: The plugin, now disabled.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/plugins.yaml#/Plugin"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
panel-token:
  parameters:
    - $ref: "../components/parameters.yaml#/PluginId"
  post:
    operationId: issuePanelToken
    tags: [plugins]
    summary: Issue a panel token
    description: |
      Issues a short-lived bearer token for a panel plugin's sandboxed frame, limited to the
      scopes in its manifest. Humans only (session cookie).
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/plugins.yaml#/PanelTokenCreate"
    responses:
      "201":
        description: The token. The secret is shown once.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/session.yaml#/IssuedToken"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
file:
  parameters:
    - $ref: "../components/parameters.yaml#/PluginId"
  get:
    operationId: getPluginFile
    tags: [plugins]
    summary: Read a panel file
    description: |
      Returns one file of a panel plugin so the interface can load it into the panel's sandboxed
      frame (as `srcdoc`, with `sandbox="allow-scripts"` only). Humans only (session cookie).

      Rules the daemon enforces: the plugin is installed and enabled; the path is normalised
      first, then must lie inside the folder of one of the plugin's declared panel entries
      (`contents.panels[].entry`), so it can never reach other plugin files or leave the plugin
      root; the file is at most 4 MiB. File content is never logged.

      The file comes back as JSON, never as a document, so a visit to this address cannot run
      it. A panel entry must be self-contained: its scripts and styles are inline. The response
      carries `Content-Security-Policy: sandbox; default-src 'none'`,
      `X-Content-Type-Options: nosniff`, `Cross-Origin-Resource-Policy: same-origin` and
      `Cache-Control: no-store`.
    security:
      - cookieAuth: []
    parameters:
      - $ref: "../components/parameters.yaml#/PluginFilePath"
    responses:
      "200":
        description: The file.
        headers:
          Content-Security-Policy:
            description: Always `sandbox; default-src 'none'`.
            schema:
              type: string
          X-Content-Type-Options:
            description: Always `nosniff`.
            schema:
              type: string
          Cross-Origin-Resource-Policy:
            description: Always `same-origin`.
            schema:
              type: string
          Cache-Control:
            description: Always `no-store`.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../components/schemas/plugins.yaml#/PluginFile"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "413":
        $ref: "../components/responses.yaml#/PayloadTooLarge"
