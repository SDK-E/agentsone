#
# Template of /etc/agentsone/config.toml, installed as
# /usr/lib/agentsone/config.toml. The entrypoint copies it on every start and
# adds the [edge] table when AGENTSONE_EDGE_IP is set. Every key not set
# here keeps the daemon's default (see internal/core/config.go).

[api]
# Listen on every container address: loopback for agents and tools inside,
# and the inner network address for the web door in edge. The daemon refuses
# callers from other addresses than loopback and [edge] trusted_proxies.
addr = "0.0.0.0:7700"
# The origin humans open the interface at, such as "https://agents.example.com".
# When set, only this origin may send state-changing browser requests (and
# open terminals). Unset, it is the address the web door was reached at, as
# the edge reports it in X-Forwarded-Host.
# public_url = "https://agents.example.com"

# Built-in event sources run inside the daemon. Every key below is optional;
# the values shown are the defaults.
# [emitters.disk]
# threshold_percent = 90   # a file system this full is "high"
# margin_percent = 2       # it is "normal" again below threshold minus margin
# interval = "1m"          # time between samples
# mounts_file = "/proc/self/mounts"
