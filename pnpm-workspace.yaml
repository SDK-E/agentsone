# SPDX-License-Identifier: MIT
packages:
  - packages/*
  - ui
  - runners/claude
  - plugins/*

minimumReleaseAgeExclude:
  - "@redocly/cli@2.82.0"
  - "@tanstack/query-core@5.108.1"
  - "@tanstack/react-query@5.108.1"
  - "@testing-library/jest-dom@8.0.0"
  - "@testing-library/user-event@14.6.13"
  - i18next@27.2.2
  - react-i18next@18.0.3

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y 6.10.2 is the latest release and has not yet widened its
    # peer range to ESLint 10. It works with flat config, so allow it explicitly.
    eslint-plugin-jsx-a11y>eslint: "10"
    # openapi-typescript 7.13.0 is the latest release and still declares TypeScript 5.
    # It only uses the stable compiler API to print code, which TypeScript 6 keeps.
    openapi-typescript>typescript: "6"
